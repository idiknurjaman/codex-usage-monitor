[package]
name = "codex-usage"
version = "1.9.1"
edition = "2021"
license = "MIT"
description = "Codex Usage"
homepage = "https://github.com/upstream-ray/codex-usage-monitor"
repository = "https://github.com/upstream-ray/codex-usage-monitor"

[workspace]
resolver = "2"

[package.metadata.winres]
CompanyName = "Ray"
ProductName = "Codex Usage"
FileDescription = "Lightweight Codex usage monitor for Windows"
OriginalFilename = "codex-usage.exe"
InternalName = "CodexUsage"
Comments = "Derived from Claude Code Usage Monitor under the MIT License"
LegalCopyright = "Original copyright (C) 2026 Code Zeno Pty Ltd; modifications (C) 2026 Ray"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.10"
codex-login = { git = "https://github.com/openai/codex.git", rev = "94cbbddafc1776d5e377bca1b05932c697e82238" }
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "94cbbddafc1776d5e377bca1b05932c697e82238" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
